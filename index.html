<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vườn Ươm Ảo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Mô phỏng 3D nhập vai thực hành giâm cành, chiết cành, ghép mắt nhỏ có gỗ – Công nghệ 9, Bài 2 (KNTT).">
<meta name="theme-color" content="#0c1d15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Bố cục: khung 3D toàn màn hình; các bảng kính tối màu tán lá bám mép như bộ đồ nghề;
   khay dụng cụ lớn ở đáy, cô hướng dẫn ở góc trên trái, nút thao tác góc dưới phải.
   Bảng màu giữ nguyên bản 1: nền xanh rừng đậm, chữ sáng, nhấn vàng mật ong, xanh lá non. */
:root {
  --bg: #0c1d15;
  --surface: #142c21;
  --surface-2: #1b382b;
  --surface-3: #234536;
  --glass: rgba(16, 36, 27, 0.9);
  --glass-solid: #142c21;
  --glass-2: #1b382b;
  --line: rgba(214, 236, 200, 0.14);
  --line-2: rgba(214, 236, 200, 0.24);
  --ink: #eef3e6;
  --muted: #b3c4ae;
  --faint: #86997f;
  --accent: #f0c75e;          /* vàng mật ong – màu nhấn chính (nút chính, mục đang chọn) */
  --accent-2: #f6dc93;
  --accent-ink: #2a2105;
  --leaf: #8fd16a;            /* xanh lá non – trạng thái đạt, điểm nhấn phụ */
  --leaf-ink: #10220c;
  --straw: #f0c75e;
  --paper: #f4f1e6;
  --paper-ink: #1c2a1f;
  --ok: #8fd16a; --warn: #f2a54d; --bad: #f07563; --info: #84c9ec;
  --ok-bg: rgba(143, 209, 106, 0.14); --warn-bg: rgba(242, 165, 77, 0.15); --bad-bg: rgba(240, 117, 99, 0.15);
  --scrim: rgba(4, 12, 8, 0.55);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.38), 0 1px 3px rgba(0, 0, 0, 0.3);
  --f-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 16px;
  --mentor-w: min(400px, 36vw);
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overscroll-behavior: none; }
/* không để trình duyệt kéo/phóng cả trang: chỉ các vùng cuộn được mới nhận thao tác vuốt (xem UI.guardTouch) */
html { touch-action: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
#view, .modal-back, .modal, .mentor-more { touch-action: pan-y; overscroll-behavior: contain; }
.table-scroll, pre.code { touch-action: pan-x pan-y; overscroll-behavior: contain; }
.hud-tray { touch-action: pan-x; overscroll-behavior: contain; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.warnline { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; font-weight: 600; }

/* ---------- khung 3D ---------- */
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#g3labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
.g3-label { position: absolute; left: 0; top: 0; will-change: transform; pointer-events: none; }
.g3-label .lb { display: inline-block; transform: translate(-50%, -50%); white-space: nowrap; font-size: 13px; font-weight: 700; }
.g3-label.clickable .lb { pointer-events: auto; cursor: pointer; }
.g3-label.pin .lb { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-size: 17px; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.8), var(--shadow); }
.g3-label.pin.soft .lb { width: auto; height: auto; padding: 5px 12px; border-radius: 999px; background: var(--glass); color: var(--ink); font-family: var(--f-ui); font-size: 13px; box-shadow: var(--shadow); }
.g3-label.sel .lb { background: var(--leaf); color: var(--leaf-ink); padding: 4px 11px; border-radius: 999px; box-shadow: var(--shadow); }
.g3-label.item-tag .lb { background: #f7f1d8; color: #2b2a1c; border: 1px solid #d9caa0; padding: 5px 10px 5px 8px; border-radius: 6px; font-size: 12.5px; box-shadow: 0 3px 10px rgba(30, 24, 8, 0.2); display: inline-flex; align-items: center; gap: 6px; transform: translate(-50%, 0) rotate(-1.5deg); white-space: normal; max-width: 150px; line-height: 1.25; text-align: left; }
.g3-label.item-tag .chk { width: 18px; height: 18px; border-radius: 5px; border: 2px solid #b9a774; flex: none; display: grid; place-items: center; font-size: 12px; color: #fff; }
.g3-label.item-tag.on .lb { background: #fff5c9; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 3px 10px rgba(30, 24, 8, 0.25); }
.g3-label.item-tag.on .chk { background: #3f8a2c; border-color: #3f8a2c; }
.g3-label.item-tag.on .chk::after { content: "✓"; }

/* ---------- màn hình tải ---------- */
#boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(120% 90% at 30% 20%, #1f4030 0%, #10261c 60%, #0c1d15 100%); transition: opacity 0.6s; padding: 16px var(--gut-r) 16px var(--gut); }
#boot.done { opacity: 0; pointer-events: none; }
.boot-card { width: min(440px, 100%); text-align: center; display: grid; gap: 14px; justify-items: center; color: var(--ink); }
.boot-card .logo { width: 84px; height: 84px; }
.boot-card h1 { font-family: var(--f-display); font-size: clamp(34px, 7vw, 48px); letter-spacing: -0.02em; }
.boot-card h1 em { font-style: italic; color: var(--accent); }
.boot-track { width: 100%; height: 8px; border-radius: 4px; background: rgba(214, 236, 200, 0.14); overflow: hidden; }
#boot-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--leaf), var(--accent)); transition: width 0.3s; }
#boot-txt { font-size: 14px; color: var(--muted); }

/* ---------- các màn 2D trên nền 3D ---------- */
#view { position: fixed; inset: 0; z-index: 6; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; pointer-events: none; }
#view > .screen { pointer-events: none; min-height: 100%; padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--gut-r) calc(env(safe-area-inset-bottom, 0px) + 28px) var(--gut); display: flex; flex-direction: column; gap: 18px; }
#view > .screen > * { pointer-events: auto; }
#view::before { content: ""; position: fixed; inset: 0; background: linear-gradient(90deg, rgba(8, 20, 14, 0.55), rgba(8, 20, 14, 0.12) 55%, rgba(8, 20, 14, 0.3)); pointer-events: none; z-index: -1; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px) saturate(1.1); backdrop-filter: blur(14px) saturate(1.1); }
.pad { padding: 18px; }
.scr-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; pointer-events: none !important; }
.scr-top > * { pointer-events: auto; }
.brand { display: inline-flex; align-items: center; gap: 10px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 5px 16px 5px 5px; box-shadow: var(--shadow); text-align: left; }
.brand .logo { width: 38px; height: 38px; display: block; }
.brand .logo svg { width: 100%; height: 100%; }
.brand b { display: block; font-family: var(--f-display); font-size: 16px; line-height: 1.1; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); }
.scr-right { display: flex; gap: 8px; flex-wrap: wrap; }
.chipbtn { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; box-shadow: var(--shadow); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrap { width: min(1180px, 100%); margin: 0 auto; display: grid; gap: 16px; }
.wrap.narrow { width: min(760px, 100%); }
.center-wrap { flex: 1; display: grid; place-items: center; }

/* trang chủ */
.home-screen { justify-content: flex-start; }
.home-card { width: min(560px, 100%); padding: clamp(20px, 3.5vw, 34px); display: grid; gap: 16px; margin-top: clamp(0px, 4vh, 40px); }
.display { font-size: clamp(42px, 8vw, 72px); font-weight: 650; letter-spacing: -0.01em; line-height: 1; }
.display em { font-style: italic; color: var(--accent); }
.lede { font-size: 16.5px; color: var(--muted); max-width: 52ch; }
.home-tech { display: grid; gap: 8px; }
.home-tech .ht { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.home-tech i { font-style: normal; font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: 18px; text-align: center; }
.home-tech b { display: block; font-size: 15.5px; }
.home-tech span { font-size: 13px; color: var(--muted); }
.cta { display: flex; gap: 10px; flex-wrap: wrap; }
.foot { font-size: 12.5px; color: var(--faint); }

/* nút */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); font-weight: 700; font-size: 14.5px; color: var(--ink); text-decoration: none; transition: transform 0.12s, background 0.15s; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); color: #fff; border-color: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
.btn.big { min-height: 52px; padding: 12px 22px; font-size: 16px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }

/* biểu mẫu */
.form-card { width: min(520px, 100%); padding: 24px; display: grid; gap: 14px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; }
.seg button { border: 0; background: transparent; padding: 9px 10px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25); }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-weight: 700; font-size: 13.5px; }
.field input, .field select, .field textarea { width: 100%; min-height: 46px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); padding: 10px 12px; font: inherit; font-size: 16px; }
.field.err input { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
.field .hint { font-size: 12.5px; color: var(--faint); }
.req { color: var(--bad); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* sảnh */
.lobby-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding: 18px 20px; }
.lobby-head h1 { font-size: clamp(24px, 3.4vw, 34px); }
.status-line { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-bg); }
.dot.off { background: var(--accent); }
.mode-seg { width: min(620px, 100%); background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); }
.mode-seg button { display: grid; gap: 1px; text-align: left; padding: 10px 14px; }
.mode-seg small { font-weight: 500; font-size: 12px; color: inherit; opacity: 0.8; }
.tech-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.tech-card { padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.tc-head { display: flex; align-items: baseline; gap: 10px; }
.tc-head .num { font-style: normal; font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: 20px; }
.tc-head h2 { font-size: 22px; }
.sp-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sp-btn { display: grid; gap: 6px; padding: 10px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--surface-2); text-align: left; transition: border-color 0.15s, transform 0.12s; }
.sp-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.sp-img { display: block; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; background: radial-gradient(circle at 50% 40%, #fbfdf6, #dfe9d6); overflow: hidden; }
.sp-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.sp-txt b { display: block; font-size: 16px; }
.sp-txt small { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
details.kb summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--accent); }
details.kb p { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.lobby-more { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.mini-card { padding: 16px; display: grid; gap: 8px; align-content: start; }
.mini-card h3 { font-size: 17px; }
.mini-card p { font-size: 13.5px; color: var(--muted); }
.mini-card .btn { justify-self: start; }

/* câu hỏi */
.quiz { display: grid; gap: 14px; }
.q-h1 { font-size: clamp(26px, 4vw, 34px); }
.q-prog { display: flex; gap: 6px; }
.q-prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); }
.q-prog i.done { background: var(--leaf); } .q-prog i.cur { background: var(--accent); }
.q-card { padding: 20px; display: grid; gap: 14px; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.q-card h3 { font-family: var(--f-ui); font-size: 18px; font-weight: 700; line-height: 1.4; }
.q-opts { display: grid; gap: 8px; }
.q-opt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface-2); font-size: 15px; }
.q-opt .k { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-weight: 800; }
.q-opt.right { border-color: var(--ok); background: var(--ok-bg); } .q-opt.wrong { border-color: var(--bad); background: var(--bad-bg); } .q-opt.sel { border-color: var(--accent); background: rgba(240, 199, 94, 0.1); } .q-opt:hover { border-color: var(--accent); }
.q-explain { font-size: 14px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }

/* bảng, kết quả, giáo viên */
.card { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.table-scroll { overflow: auto; border: 1px solid var(--line); border-radius: 12px; max-height: 60vh; background: var(--surface); }
table.data { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 760px; }
table.data th, table.data td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.data th { position: sticky; top: 0; background: #1a3328; z-index: 1; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
table.data th.sorted::after { content: " ▾"; color: var(--accent); } table.data th.sorted.asc::after { content: " ▴"; }
table.data tbody tr { cursor: pointer; } table.data tbody tr:hover { background: var(--glass-2); }
table.data td.n { text-align: right; font-variant-numeric: tabular-nums; }
.lvl { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.lvl.tot { background: rgba(143, 209, 106, 0.16); color: #bdf09a; border: 1px solid rgba(143, 209, 106, 0.4); } .lvl.dat { background: rgba(240, 199, 94, 0.14); color: #ffe39a; border: 1px solid rgba(240, 199, 94, 0.4); } .lvl.chua { background: rgba(240, 117, 99, 0.14); color: #ffc0b4; border: 1px solid rgba(240, 117, 99, 0.4); } .lvl.kha { background: rgba(132, 201, 236, 0.14); color: #c4e8fa; border: 1px solid rgba(132, 201, 236, 0.4); }
.result-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 16px; align-items: start; }
.score-hero { padding: 20px; display: grid; gap: 14px; }
.score-row { display: flex; gap: 12px; flex-wrap: wrap; }
.score-box { flex: 1 1 130px; padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.score-box > span { display: block; font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
.score-box b { font-family: var(--f-display); font-size: 40px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.score-box small { color: var(--muted); }
table.rubric { width: 100%; border-collapse: collapse; font-size: 14px; }
table.rubric th, table.rubric td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.rubric th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
table.rubric td.c, table.rubric th.c { text-align: center; }
table.rubric .mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 800; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.instr { font-size: 14px; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.list-plain { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }
.dash-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.tile { padding: 14px; }
.tile span { display: block; font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.07em; }
.tile b { font-family: var(--f-display); font-size: 30px; font-variant-numeric: tabular-nums; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.filters .field { min-width: 130px; flex: 1 1 130px; }
.filters .field input, .filters .field select { min-height: 40px; font-size: 14px; padding: 8px 10px; }
.dash-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.chart-box { padding: 14px; }
pre.code { background: #08130d; border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; font-size: 12.5px; max-height: 260px; white-space: pre; font-family: var(--f-num); }
.steps-guide { counter-reset: s; display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.steps-guide li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; font-size: 14px; color: var(--muted); }
.steps-guide li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13px; }
.steps-guide b { color: var(--ink); }
.cert-img { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); background: #fff; }

/* ---------- hộp thoại ---------- */
#modal-root { position: relative; z-index: 40; }
.modal-back { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) var(--gut-r) calc(env(safe-area-inset-bottom, 0px) + 16px) var(--gut); overflow-y: auto; animation: fadein 0.18s ease-out; }
.modal { width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 14px; }
.modal.wide { width: min(900px, 100%); }
.modal h2 { font-size: 22px; }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
.pick-card { display: grid; gap: 4px; text-align: left; padding: 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--surface-2); }
.pick-card:hover { border-color: var(--accent); }
.pick-card b { font-size: 15.5px; } .pick-card span { font-size: 13px; color: var(--muted); }
.pick-card.wrong { border-color: var(--bad); background: var(--bad-bg); opacity: 0.7; }
.pause-menu { display: grid; gap: 8px; }
.handbook ol { padding-left: 20px; display: grid; gap: 8px; margin: 10px 0; }
.handbook li { font-size: 14.5px; }
.mission-modal { width: min(640px, 100%); }
.mission { display: grid; gap: 14px; }
.mission-head { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
.mission-ava svg { width: 64px; height: 64px; display: block; }
.mission h2 { font-size: clamp(22px, 3.4vw, 28px); }
.mission-text { font-size: 15.5px; }
.mission-sp { display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border-left: 4px solid var(--leaf); }
.mission-sp span { font-size: 12.5px; color: var(--muted); }
.mission-sp p { font-size: 13.5px; color: var(--muted); }
.mission-list { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14.5px; }
.report-modal { width: min(480px, 100%); }
.step-report { display: grid; gap: 12px; }
.sr-score { display: flex; align-items: baseline; gap: 10px; }
.sr-score b { font-family: var(--f-display); font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
.sr-score span { color: var(--muted); }
.sr-score.ok b { color: var(--ok); } .sr-score.mid b { color: var(--warn); } .sr-score.low b { color: var(--bad); }
.sr-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.sr-list li { padding: 8px 12px 8px 34px; border-radius: 10px; font-size: 14px; position: relative; }
.sr-list li::before { position: absolute; left: 11px; top: 8px; font-weight: 800; }
.sr-list.good li { background: var(--ok-bg); } .sr-list.good li::before { content: "✓"; color: var(--ok); }
.sr-list.bad li { background: var(--warn-bg); } .sr-list.bad li::before { content: "!"; color: var(--warn); }
.sgk { font-size: 13.5px; color: var(--muted); }

/* ---------- thông báo ---------- */
#veil { position: fixed; inset: 0; background: #0c1d15; opacity: 0; pointer-events: none; z-index: 30; }
#veil.on { opacity: 1; transition: none; }
#veil.on.out { opacity: 0; transition: opacity 0.6s ease; }
body.in-sim #toast-root { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 184px); }
#toast-root { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translateX(-50%); z-index: 45; display: grid; gap: 8px; justify-items: center; width: min(520px, calc(100% - 32px)); pointer-events: none; }
.toast { background: #20392d; border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 16px; box-shadow: var(--shadow); font-weight: 600; font-size: 14px; text-align: center; animation: toastin 0.22s ease-out; }
.toast.good { border-color: rgba(143, 209, 106, 0.6); color: #cdf2b5; } .toast.warn { border-color: rgba(242, 165, 77, 0.65); color: #ffd7a8; } .toast.bad { border-color: rgba(240, 117, 99, 0.7); color: #ffc0b4; }

/* ---------- HUD trong bài ---------- */
#hud { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
#hud > * { pointer-events: auto; }
.hud-top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: var(--gut); right: var(--gut-r); display: flex; align-items: center; gap: 10px; pointer-events: none !important; }
.hud-top > * { pointer-events: auto; }
.hud-ibtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); box-shadow: var(--shadow); flex: none; color: var(--ink); }
.hud-ibtn svg { width: 22px; height: 22px; }
.hud-ibtn.on { color: var(--accent); }
.hud-ibtn:not(.on) svg { opacity: 0.55; }
.hud-ibtn:first-child svg { opacity: 1; }
.hud-title { display: grid; min-width: 0; max-width: 42%; padding: 6px 14px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); }
.hud-title b { font-family: var(--f-display); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-title span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-steps { flex: 1; display: flex; gap: 5px; min-width: 60px; pointer-events: none !important; }
.hud-steps i { flex: 1; height: 6px; border-radius: 3px; background: rgba(16, 36, 27, 0.6); box-shadow: inset 0 0 0 1px rgba(214, 236, 200, 0.25); }
.hud-steps i.done { background: var(--leaf); } .hud-steps i.cur { background: var(--accent); }
.hud-timer { font-family: var(--f-num); font-weight: 700; font-size: 16px; padding: 9px 14px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.hud-timer.low { color: var(--bad); }
.hud-right { display: flex; gap: 8px; }
.hud-mentor { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 66px); left: var(--gut); width: var(--mentor-w); display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: start; pointer-events: none !important; }
.hud-mentor > * { pointer-events: auto; }
.mentor-ava { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px var(--accent), var(--shadow); cursor: pointer; background: var(--surface); }
.mentor-ava svg { width: 100%; height: 100%; display: block; }
.mentor-bubble { position: relative; background: var(--glass); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; box-shadow: var(--shadow); padding: 11px 14px 8px; display: grid; gap: 6px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.mentor-say { font-size: 15px; line-height: 1.45; font-weight: 500; }
.mentor-more { font-size: 13.5px; color: var(--muted); display: grid; gap: 6px; max-height: 34vh; overflow: auto; }
.mentor-btns { display: flex; gap: 4px; justify-content: flex-end; }
.mbtn { border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: 13px; padding: 4px 8px; border-radius: 8px; display: inline-flex; align-items: center; }
.mbtn svg { width: 18px; height: 18px; }
.mbtn:hover { background: var(--surface-3); }
.hud-mentor.warn .mentor-bubble { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn-bg), var(--shadow); }
.hud-mentor.good .mentor-bubble { border-color: var(--ok); }
.hud-mentor.pop .mentor-bubble { animation: pop 0.28s ease-out; }
.hud-mentor.collapsed { width: auto; grid-template-columns: 56px; }
.hud-mentor.collapsed .mentor-bubble { display: none; }
.hud-mentor.collapsed .mentor-ava { position: relative; overflow: visible; }
.hud-mentor.collapsed .mentor-ava svg { border-radius: 50%; }
.hud-mentor.collapsed .mentor-ava::after { content: '…'; position: absolute; right: -6px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 14px; line-height: 16px; text-align: center; box-shadow: var(--shadow); }
.hud-tray { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; max-width: min(720px, calc(100vw - 520px)); overflow-x: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); scrollbar-width: thin; }
.tool { flex: none; width: 92px; display: grid; gap: 2px; justify-items: center; padding: 6px 4px 7px; border-radius: 14px; border: 2px solid transparent; background: transparent; transition: background 0.15s, transform 0.12s; }
.tool .ti { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 12px; background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.95), rgba(225, 233, 218, 0.9)); }
.tool .ti img, .tool .ti svg { width: 60px; height: 60px; object-fit: contain; }
.tool .ti .ph { font-family: var(--f-display); font-size: 26px; color: var(--leaf); }
.tool .tn { font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.tool:hover { background: var(--surface-2); }
.tool.on { border-color: var(--accent); background: rgba(240, 199, 94, 0.14); transform: translateY(-3px); box-shadow: inset 0 0 0 1px var(--accent); }
.tool.on .tn { color: var(--accent); }
.tool.hint:not(.on) { animation: hintpulse 1.4s infinite; }
.hud-actions { position: absolute; right: var(--gut-r); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-direction: column; align-items: stretch; gap: 8px; width: 210px; }
.abtn { min-height: 46px; padding: 10px 16px; border-radius: 13px; border: 1px solid var(--line); background: var(--glass); font-weight: 700; font-size: 14.5px; box-shadow: var(--shadow); color: var(--ink); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.abtn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; min-height: 54px; font-size: 16px; }
.abtn.ok { background: var(--leaf); color: var(--leaf-ink); border-color: transparent; min-height: 52px; font-size: 15.5px; }
.abtn.ghost { background: var(--glass); }
.abtn:disabled { opacity: 0.45; cursor: default; }
.hud-view { position: absolute; right: var(--gut-r); top: 50%; transform: translateY(-60%); display: flex; flex-direction: column; gap: 6px; }
.vbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); position: relative; }
.vbtn svg { width: 20px; height: 20px; }
.vbtn.rot { width: 52px; height: 52px; }
.vbtn.rot i { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 9.5px; font-weight: 800; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 4px; }
.vbtn.rot.on { background: var(--accent); color: var(--accent-ink); }
.hud-readouts { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 66px); left: calc(var(--gut) + var(--mentor-w) + 18px); right: calc(var(--gut-r) + 232px); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; pointer-events: none !important; }
.ro { display: grid; padding: 6px 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 96px; }
.ro small { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.ro b { font-family: var(--f-num); font-size: 17px; font-variant-numeric: tabular-nums; }
.ro.good { box-shadow: inset 0 0 0 2px var(--ok), var(--shadow); } .ro.warn { box-shadow: inset 0 0 0 2px var(--warn), var(--shadow); } .ro.bad { box-shadow: inset 0 0 0 2px var(--bad), var(--shadow); }
.hud-cue { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 136px); transform: translateX(-50%); background: rgba(20, 30, 22, 0.78); color: #f4f7ef; padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; pointer-events: none !important; white-space: nowrap; }
.hud-day { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 72px); right: var(--gut-r, 16px); left: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 8px 18px; display: flex; align-items: center; gap: 10px; pointer-events: none !important; }
.hud-day b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.hud-day .sun { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle, #ffd45a 40%, rgba(255, 212, 90, 0.2) 70%); display: inline-block; }
.hud-day .sun.moon { background: radial-gradient(circle at 35% 35%, #f2f4f8 45%, #b9c0cc 75%); }

/* ---------- hoạt cảnh ---------- */
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(0.96); } 60% { transform: scale(1.015); } 100% { transform: none; } }
@keyframes hintpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(240, 199, 94, 0); border-color: transparent; } 50% { box-shadow: 0 0 0 4px rgba(240, 199, 94, 0.35); border-color: var(--accent); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- máy tính bảng ---------- */
@media (max-width: 1100px) {
  .tech-grid { grid-template-columns: 1fr 1fr; }
  .lobby-more { grid-template-columns: 1fr 1fr; }
  .dash-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hud-tray { max-width: calc(100vw - 260px - var(--gut) - var(--gut-r)); left: var(--gut); transform: none; }
  :root { --mentor-w: min(380px, 46vw); }
}
/* ---------- màn hình hẹp: nội dung trang ---------- */
@media (max-width: 760px) {
  body { font-size: 14.5px; }
  .tech-grid, .lobby-more, .result-grid { grid-template-columns: 1fr; }
  .dash-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row2 { grid-template-columns: 1fr; }
  .modal { padding: 18px; }
  .mission-head { grid-template-columns: 48px 1fr; } .mission-ava svg { width: 48px; height: 48px; }
  .home-card { margin-top: 0; }
}
/* ---------- điện thoại cầm dọc (và cửa sổ hẹp mà cao): bảng điều khiển xếp chồng trên – dưới ----------
   Điện thoại xoay ngang / cửa sổ hẹp mà thấp (rộng 600 – 760, cao ≤ 520) dùng bố cục "màn hình thấp" bên dưới. */
@media (max-width: 599px), (max-width: 760px) and (min-height: 521px) {
  .hud-top { gap: 6px; }
  .hud-title { max-width: none; flex: 1; padding: 5px 10px; }
  .hud-title b { font-size: 13.5px; }
  .hud-steps { display: none; }
  .hud-right .hud-ibtn:not(:last-child) { display: none; }
  .hud-ibtn { width: 40px; height: 40px; }
  .hud-timer { font-size: 14px; padding: 8px 10px; }
  .hud-mentor { top: calc(env(safe-area-inset-top, 0px) + 62px); right: var(--gut-r); width: auto; grid-template-columns: 42px 1fr; gap: 8px; }
  .mentor-ava { width: 42px; height: 42px; }
  .mentor-bubble { padding: 8px 11px 5px; }
  .mentor-say { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .hud-mentor.collapsed { right: auto; grid-template-columns: 42px; }
  .hud-tray { left: var(--gut); right: var(--gut-r); transform: none; max-width: none; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); padding: 6px; gap: 4px; border-radius: 16px; }
  .tool { width: 74px; padding: 4px 2px 5px; }
  .tool .ti { width: 52px; height: 52px; }
  .tool .ti img, .tool .ti svg { width: 48px; height: 48px; }
  .tool .tn { font-size: 12px; }
  .hud-actions { right: var(--gut-r); left: var(--gut); width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tray-h, 96px) + 14px); flex-direction: row; justify-content: flex-end; flex-wrap: wrap; }
  .abtn { min-height: 42px; padding: 8px 12px; font-size: 13.5px; }
  .abtn.primary, .abtn.ok { min-height: 46px; font-size: 14.5px; }
  .hud-view { top: auto; bottom: var(--above-act, 160px); transform: none; }
  .vbtn { width: 40px; height: 40px; }
  .vbtn:nth-child(2), .vbtn:nth-child(3) { display: none; }
  .hud-readouts { top: auto; bottom: var(--above-act, 158px); max-width: calc(100vw - 90px); left: var(--gut); right: auto; justify-content: flex-start; }
  .ro { min-width: 0; padding: 4px 9px; } .ro b { font-size: 15px; } .ro small { font-size: 10px; }
  .hud-cue { bottom: calc(var(--above-act, 160px) + 54px); font-size: 13px; white-space: normal; text-align: center; max-width: calc(100vw - 32px); }
  .hud-day { top: auto; right: auto; left: 50%; transform: translateX(-50%); bottom: calc(var(--above-act, 160px) + 54px); }
  #toast-root, body.in-sim #toast-root { top: calc(env(safe-area-inset-top, 0px) + 150px); bottom: auto; }
}

/* ---------- màn hình thấp (laptop 1366×768, laptop đặt phóng to 125–150%, điện thoại xoay ngang) ---------- */
/* cụm nút góc nhìn xếp 2 cột ở góc trên phải (không còn chồng lên các nút thao tác ở góc dưới phải) */
@media (max-height: 700px) and (min-width: 761px), (max-height: 520px) and (min-width: 600px) {
  .hud-view { top: calc(env(safe-area-inset-top, 0px) + 68px); transform: none; display: grid; grid-template-columns: repeat(2, 44px); gap: 6px; }
  .vbtn.rot { width: 44px; height: 44px; }
  .vbtn:nth-child(1) { order: 1; } .vbtn:nth-child(6) { order: 2; } .vbtn:nth-child(2) { order: 3; } .vbtn:nth-child(3) { order: 4; } .vbtn:nth-child(4) { order: 5; } .vbtn:nth-child(5) { order: 6; }
  .hud-day { right: calc(var(--gut-r) + 106px); padding: 6px 14px; }
  .hud-day b { font-size: 19px; }
  .display { font-size: clamp(38px, 5.2vw, 56px); }
  .home-card { width: min(1000px, 100%); grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); column-gap: clamp(18px, 3vw, 36px); row-gap: 10px; align-items: start; margin-top: 0; padding: 20px 26px; }
  .home-card > .eyebrow { grid-column: 1; grid-row: 1; } .home-card > .display { grid-column: 1; grid-row: 2; } .home-card > .lede { grid-column: 1; grid-row: 3; font-size: 15px; }
  .home-card > .foot { grid-column: 1; grid-row: 4; } .home-card > .verlink { grid-column: 1; grid-row: 5; }
  .home-card > .home-tech { grid-column: 2; grid-row: 1 / span 3; gap: 6px; } .home-card > .cta { grid-column: 2; grid-row: 4 / span 2; align-self: end; }
  .home-tech .ht { padding: 6px 10px; }
  #view > .screen { gap: 12px; }
}
@media (max-height: 560px) and (min-width: 761px), (max-height: 520px) and (min-width: 600px) {
  :root { --mentor-w: min(360px, 34vw); }
  .hud-top { top: calc(env(safe-area-inset-top, 0px) + 6px); }
  .hud-ibtn { width: 40px; height: 40px; }
  .hud-title { padding: 4px 12px; } .hud-title b { font-size: 14px; } .hud-title span { font-size: 12px; }
  .hud-mentor { top: calc(env(safe-area-inset-top, 0px) + 54px); grid-template-columns: 44px 1fr; gap: 8px; }
  .mentor-ava { width: 44px; height: 44px; }
  .mentor-bubble { padding: 8px 12px 5px; gap: 3px; }
  .mentor-say { font-size: 13.5px; line-height: 1.4; }
  .mentor-more { max-height: 26vh; font-size: 13px; }
  .hud-mentor.collapsed { grid-template-columns: 44px; }
  .hud-readouts { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tray-h, 90px) + 16px); left: calc(var(--gut) + 196px); right: calc(var(--gut-r) + 196px); gap: 6px; align-items: flex-end; }
  .ro { padding: 4px 10px; min-width: 84px; } .ro b { font-size: 15px; } .ro small { font-size: 10px; }
  .hud-view { top: calc(env(safe-area-inset-top, 0px) + 54px); grid-template-columns: repeat(2, 40px); gap: 5px; }
  .vbtn, .vbtn.rot { width: 40px; height: 40px; }
  .hud-day { top: calc(env(safe-area-inset-top, 0px) + 54px); right: calc(var(--gut-r) + 96px); }
  .hud-tray { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); padding: 5px; gap: 4px; border-radius: 16px; }
  .tool { width: 76px; padding: 4px 2px 5px; }
  .tool .ti { width: 50px; height: 50px; } .tool .ti img, .tool .ti svg { width: 46px; height: 46px; }
  .tool .tn { font-size: 12px; }
  .hud-actions { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); width: 184px; gap: 6px; }
  .abtn { min-height: 38px; padding: 6px 12px; font-size: 13.5px; }
  .abtn.primary { min-height: 44px; font-size: 15px; } .abtn.ok { min-height: 42px; font-size: 14.5px; }
  .hud-cue { bottom: calc(env(safe-area-inset-bottom, 0px) + var(--tray-h, 90px) + 16px); font-size: 13px; padding: 6px 14px; }

  TL.sack = function (lines, o) {
    o = o || {};
    var g = new (th().Group)(); g.name = 'sack';
    var W = o.w || 22, H = o.h || 26, D = o.d || 12;
    var geo = new (th().BoxGeometry)(W, H, D, 8, 8, 4), p = geo.attributes.position, n = new Tex.Noise(6), v = new (th().Vector3)();

      var bul = 1 + 0.12 * Math.sin(t * Math.PI);

    }
    geo.computeVertexNormals();
    var col = o.color || 0xe7dcc0;

  };

  /* -------- THAO TÁC DAO (thiết kế lại cho dễ thao tác, kể cả trên điện thoại)

     Nhát 2: chạm vào thân phía trên nhát 1 để đặt dao → KÉO DAO XUỐNG dọc thân (dao chạy theo thân), gặp nhát 1 là xong. -------- */
  function knCtx(ctx) { return ctx._kn || (ctx._kn = { phase: 1, s: null, ang: 40, s2: null, cur: null, drag: null }); }
  function knBr(ctx) { return ctx._bs ? ctx._bs.br : ctx._sd.branch; }
  function knRef(ctx) { return ctx._bs ? ctx._bs.good.s : 18.5; }
  /** Điểm chạm chiếu lên trục thân; chạm trong vòng ~2,5 cm quanh thân đều nhận (thân mảnh, khó chạm trúng) */

    if (ph === 1) {

  function knReadouts(ctx) {

      else ctx.readouts([{ label: 'Cách mặt bầu', value: fmt(kn.s - 1) + ' cm', state: kn.s - 1 >= 15 && kn.s - 1 <= 20 ? 'good' : 'warn' }, { label: 'Nghiêng so với thân', value: Math.round(kn.ang) + '°', state: angOk ? 'good' : 'warn' }]);
    } else if (kn.phase === 2 && kn.s2 !== null) {

      else ctx.readouts([{ label: 'Dài miệng ghép', value: fmt(len) + ' cm' }, { label: 'Mắt ghép dài', value: fmt(ctx.state.chip ? ctx.state.chip.len : 1.8) + ' cm', always: true }]);

      if (q.s <= C.low.s + 0.65) { ctx.toast('Đặt dao ở phía trên nhát 1 (phía trên mắt), rồi kéo dao xuống.', 'warn'); return true; }

  /* ==================== BƯỚC 1 – CẮT LẤY MẮT GHÉP ==================== */
  var step1 = {
    id: 'laymat', title: 'Cắt lấy mắt ghép', short: 'Lấy mắt ghép', pick: 'Cắt miếng vỏ có mầm ngủ và ít gỗ',
    sgk: 'Chọn mắt ghép ở đoạn giữa cành; cắt lấy miếng vỏ dài khoảng 1,5 – 2 cm có mầm ngủ và một ít gỗ: nhát thứ nhất dưới mắt khoảng 0,5 cm, nghiêng 30 – 45°; nhát thứ hai từ trên mắt khoảng 1 – 1,5 cm vát xuống gặp nhát thứ nhất.',
    brief: 'Cắt lấy một mắt ghép đạt yêu cầu từ cành lấy mắt.',
    say: 'Em tự chọn một mắt mập ở đoạn giữa cành. Nhát 1: chạm vào thân dưới mắt khoảng 0,5 cm để đặt dao, kéo trái – phải chỉnh độ nghiêng 30 – 45°, rồi bấm "Cắt nhát 1". Nhát 2: chạm vào thân trên mắt 1 – 1,5 cm và kéo dao xuống dọc thân gặp nhát 1.',
    detail: 'Sau khi đặt dao: kéo lên – xuống để dời vị trí dao, kéo sang trái – phải để đổi độ nghiêng (số đo hiện ở trên). Vạch vàng là đường dao sẽ cắt. Nhát 2 lạng dọc, sát sau mầm ngủ, mang theo một lớp gỗ mỏng; kéo dao từ trên xuống tới khi gặp nhát 1. Miếng mắt dài 1,5 – 2 cm.',
    tools: ['knife', 'hand'], tool: 'knife', expectSec: 90,
    enter: function (ctx) {
      W.setLight('inside', 0.6);
      var B = ctx._bs = budstick(ctx);
      B.g.position.set(-4, BY() + 1.6, 8); G3.stage.add(B.g);
      var cloth = TL.cloth(); cloth.position.set(16, BY(), 10); G3.stage.add(cloth);
      ctx._cuts = { low: null, top: null }; ctx._kn = null; knCtx(ctx);
      // không chỉ điểm sẵn mắt nào: khung nhìn thấy nhiều mắt trên cành để em tự chọn (nhìn chếch 3/4 để thấy độ nghiêng dao)
      var c = wpt(B.br, B.good.s);
      ctx.view({ target: c, theta: 0.42, phi: 1.42, dist: K.fitDist(8, 11), minDist: 3, maxDist: 120, minPhi: 0.3, maxPhi: 1.62 }, 1.6, { walk: true });

    },

    up: function (ctx) { knUp(ctx); },
    cancel: function (ctx) { knCancel(ctx); },

    hint: function (ctx) {
      var br = ctx._bs.br, gs = ctx._bs.good.s;
      VU.Guide3.ring(G3.fx, wpt(br, gs - 0.5).add(V(0, 0, 0.8)), 0.35, V(0, 0, 1), 0xff9a4d);
      VU.Guide3.ring(G3.fx, wpt(br, gs + 1.2).add(V(0, 0, 0.8)), 0.35, V(0, 0, 1), 0x9be15d);
      ctx.say('Gợi ý: mắt mập nhất ở giữa cành. Chấm cam: chỗ đặt dao nhát 1 (dưới mắt 0,5 cm). Chấm xanh: chỗ đặt dao nhát 2 (trên mắt 1,2 cm), rồi kéo dao xuống gặp nhát 1.');

    check: function (ctx) { if (!ctx._chipMade) return 'Cần cắt đủ hai nhát để lấy được miếng mắt ghép.'; return null; },

      var qLen = band(len, [1.45, 2.1], [1.1, 2.6]), qBelow = band(below, [0.25, 0.85], [0.1, 1.2]), qAng = band(c.low.ang, [25, 55], [15, 70]), qBud = below > 0.15 && above > 0.25 ? 1 : 0;
      if (!qBud) fb.push(['bad', 'Miếng mắt không chứa mầm ngủ – mắt ghép hỏng!']);
      if (qLen < 1) fb.push(['bad', 'Miếng mắt dài ' + fmt(len) + ' cm (yêu cầu 1,5 – 2 cm).']);
      if (qBelow < 1) fb.push(['warn', 'Nhát 1 cách mắt ' + fmt(below) + ' cm (nên khoảng 0,5 cm).']);

  /** Xử lí một nhát dao (dùng chung cho mắt ghép và miệng ghép) */
  function knifeCut(ctx, br, r, refS, which) {
    var C = ctx._cuts;
    if (!C.low) {
      C.low = { s: r.sx, ang: r.ang };
      VU.Audio.play('cut');
      notch(ctx, br, C.low.s);
      ctx.tip(which === 'mat' ? 'Nhát 1 xong. Chạm vào thân phía trên mắt khoảng 1 – 1,5 cm để đặt dao, rồi kéo dao xuống dọc thân gặp nhát 1.' : 'Nhát 1 xong. Chạm vào thân phía trên nhát 1 (miệng dài hơn mắt ghép một chút) rồi kéo dao xuống gặp nhát 1.');

      G3.anim(0.9, function (k) { var e = 1 - Math.pow(1 - k, 3); chip.position.copy(p0).addScaledVector(out, e * 1.4).addScaledVector(fm.t, -e * 0.5); }).then(function () {
        ctx.tip('Đã lấy được miếng mắt ghép (có mầm ngủ và một lớp gỗ mỏng phía sau). Em có thể xoay để xem, rồi bấm "Xong bước".');

      ctx._opened = true;
      var p1 = chip.position.clone();

  /** Vết khía của nhát dao đầu (đường đậm mảnh trên vỏ) */

  TECH.steps.push(step1);

  /* ==================== BƯỚC 2 – CHỌN VỊ TRÍ, TẠO MIỆNG GHÉP ==================== */
  var step2 = {
    id: 'vitri', title: 'Tạo miệng ghép', short: 'Tạo miệng ghép', pick: 'Mở miệng ghép trên gốc ghép',

    var wrap = h('div', { class: 'wrap narrow' }), host = h('div', { class: 'quiz' });
    wrap.appendChild(host); scr.appendChild(wrap); view.appendChild(scr);
    function render() {
      VU.clear(host);
      host.appendChild(h('div', {}, [h('div', { class: 'eyebrow', text: 'Ôn tập · ' + VU.TECH[id].name }), h('h1', { class: 'q-h1', text: i < items.length ? 'Câu ' + (i + 1) + ' / ' + items.length : 'Kết quả ôn tập' })]));
      if (i >= items.length) {
        host.appendChild(h('div', { class: 'glass q-card' }, [h('h3', { text: 'Em trả lời đúng ' + right + '/' + items.length + ' câu.' }), h('p', { class: 'muted', text: 'Phần ôn tập không ghi vào bảng kết quả. Hãy vào chế độ Kiểm tra để được chấm điểm.' })]));
        var b = h('button', { class: 'btn primary', type: 'button', text: 'Về sảnh' });
        b.addEventListener('click', function () { App.go('lobby'); });
        host.appendChild(b); return;
      }
      var it = items[i], card = h('div', { class: 'glass q-card' }), opts = h('div', { class: 'q-opts' }), locked = false;
      card.appendChild(h('h3', { text: it.q }));
      it.o.forEach(function (o, k) {
        var bt = h('button', { class: 'q-opt', type: 'button' }, [h('span', { class: 'k', text: 'ABCD'[k] }), h('span', { text: o })]);
        bt.addEventListener('click', function () {
          if (locked) return; locked = true;
          var ok = k === it.a; if (ok) right++;
          VU.Audio.play(ok ? 'good' : 'error');
          bt.classList.add(ok ? 'right' : 'wrong'); if (!ok) opts.children[it.a].classList.add('right');
          card.appendChild(h('div', { class: 'q-explain', text: it.why }));
          var nx = h('button', { class: 'btn primary', type: 'button', text: 'Tiếp' });
          nx.addEventListener('click', function () { i++; render(); });
          card.appendChild(nx);
        });
        opts.appendChild(bt);
      });
      card.appendChild(opts); host.appendChild(card);
    }
    render();
  }

  /* ---------------- Lịch sử trên máy ---------------- */
  function history(view) {
    var u = Data.User.get();
    var scr = h('div', { class: 'screen' }); userChip(scr);
    var wrap = h('div', { class: 'wrap' });
    wrap.appendChild(h('div', { class: 'lobby-head glass' }, [h('div', {}, [h('div', { class: 'eyebrow', text: 'Trên thiết bị này' }), h('h1', { text: 'Kết quả của tôi' })])]));
    var all = Data.Local.all().filter(function (r) { return !u || r.name === u.name; }).reverse();
    var box = h('div', { class: 'glass pad' });
    if (!all.length) box.appendChild(h('div', {}, [h('h3', { text: 'Chưa có kết quả nào' }), h('p', { class: 'muted', text: 'Hoàn thành một bài Luyện tập hoặc Kiểm tra, kết quả sẽ hiện ở đây.' })]));
    else {
      var sc = h('div', { class: 'table-scroll' }), t = h('table', { class: 'data' });
      t.appendChild(h('thead', {}, [h('tr', {}, ['Thời gian', 'Kỹ thuật', 'Cây', 'Chế độ', 'Thực hành', 'Lý thuyết', 'Điểm chung', 'Xếp loại'].map(function (x) { return h('th', { text: x }); }))]));
      var tb = h('tbody');
      all.forEach(function (r) {
        var tr = h('tr', {}, [h('td', { text: VU.fmtDate(r.ts) }), h('td', { text: r.techName }), h('td', { text: r.species || '' }), h('td', { text: r.modeName }), h('td', { class: 'n', text: VU.fmtFixed(r.practice, 1) }), h('td', { class: 'n', text: r.quiz === '' ? '–' : VU.fmtFixed(r.quiz, 1) }), h('td', { class: 'n', text: VU.fmtFixed(r.overall, 1) }), h('td', {}, [h('span', { class: 'lvl ' + VU.levelClass(r.rank), text: r.rank })])]);
        tr.addEventListener('click', function () { VU.Result.saveCertificate(r); });
        tb.appendChild(tr);
      });
      t.appendChild(tb); sc.appendChild(t); box.appendChild(sc);
      box.appendChild(h('p', { class: 'faint small', text: 'Chạm vào một dòng để lưu lại phiếu kết quả.' }));
    }
    wrap.appendChild(box);
    var b = h('button', { class: 'btn', type: 'button', text: 'Về sảnh' });
    b.addEventListener('click', function () { App.go('lobby'); });
    wrap.appendChild(b);
    scr.appendChild(wrap); view.appendChild(scr);
  }

  /* ---------------- Khởi động ---------------- */
  App.init = function () {
    Data.Backend.detect();
    Data.Settings.loadRemote().catch(function () {});
    Data.Queue.flush().catch(function () {});
    setInterval(function () { Data.Queue.flush().catch(function () {}); }, 20000);
    var start = location.hash === '#giao-vien' ? 'teacher' : Data.User.get() ? 'lobby' : 'home';
    if (start === 'teacher') { App.go('home'); VU.Teacher.open(); } else App.go(start);
    window.addEventListener('hashchange', function () { if (location.hash === '#giao-vien') VU.Teacher.open(); });
    document.addEventListener('pointerdown', function once() { VU.Audio.init(); if (VU.Audio.ambientOn) VU.Audio.startAmbient(); document.removeEventListener('pointerdown', once); });
  };
  VU.App = App;
})(VU);

/* ==== 99-boot ==== */
/* ==========================================================================
   Khởi động: nạp thư viện 3D (CDN dự phòng), dựng vườn ươm, tạo biểu tượng.
   ========================================================================== */
(function () {
  'use strict';
  var CDN2 = 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
  function $(id) { return document.getElementById(id); }
  function progress(p, txt) {
    var b = $('boot-bar'), t = $('boot-txt');
    if (b) b.style.width = Math.round(p * 100) + '%';
    if (t && txt) t.textContent = txt;
  }
  function fail(msg) {
    var bt = $('boot');
    if (bt) bt.innerHTML = '<div class="boot-card"><h2>Chưa mở được Vườn Ươm Ảo</h2><p>' + msg + '</p><p class="small">Nên dùng Chrome, Edge, Safari hoặc Firefox bản mới; bật tăng tốc phần cứng (WebGL).</p></div>';
  }
  function webglOK() {
    try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) { return false; }
  }
  function ensureThree(cb) {
    if (window.THREE) return cb();
    var s = document.createElement('script');
    s.src = CDN2; s.onload = function () { cb(); };
    s.onerror = function () { fail('Không tải được thư viện đồ hoạ 3D. Hãy kiểm tra kết nối mạng rồi tải lại trang.'); };
    document.head.appendChild(s);
  }
  function tick(fn) { return new Promise(function (r) { setTimeout(function () { r(fn && fn()); }, 16); }); }
  function speciesJobs() {
    var T = window.THREE, P3 = VU.P3, jobs = [];
    ['chanh', 'oi', 'buoi', 'vai', 'xoai'].forEach(function (k) {
      try {
        var sp = VU.SP3[k], L = sp.leaf.compound ? 22 : k === 'xoai' ? 26 : 20;
        var br = new P3.Branch(k, { len: L, r0: 0.3, r1: 0.14, seed: 9, step: 0.5, age: function () { return 0.35; }, leafRule: function (n) { return n.s > L * 0.25 ? { kind: 'adult', len: sp.leaf.len[0] * (k === 'xoai' ? 0.8 : 1) } : { kind: null }; }, thorns: false, leafDroop: 0.3 });
        var g = new T.Group(); g.add(br.group); br.group.rotation.z = -0.9;
        jobs.push({ id: 'sp-' + k, obj: g, job: VU.G3.snapPrepare(g, { size: 200, dir: [0.2, 0.5, 1], pad: 0.98 }) });
      } catch (e) { console.warn('sp icon', k, e); }
    });
    return jobs;
  }
  function boot() {
    if (!webglOK()) { fail('Thiết bị hoặc trình duyệt này chưa hỗ trợ đồ hoạ 3D (WebGL).'); return; }
    ensureThree(function () {
      var jobs = [], log = VU.bootLog = [], tBoot = performance.now();
      var steps = [
        [0.06, 'Khởi tạo không gian 3D…', function () { VU.UI.guardTouch(); VU.G3.init($('gl'), $('g3labels')); VU.HUD.mount(); }],
        [0.14, 'Vẽ vân vỏ cây, phiến lá…', function () { ['chanh', 'oi', 'buoi', 'vai', 'xoai'].forEach(function (k) { VU.Tex3.leaf(k); }); }],
        [0.24, 'Dựng nhà lưới, bàn thao tác…', function () { VU.World.build(); }],
        [0.34, 'Chuẩn bị dụng cụ…', function () { jobs = VU.Tools3.prepIcons(); }],
        [0.42, 'Gieo cây giống…', function () { jobs = jobs.concat(speciesJobs()); }],
        // dịch shader: tạo hết rồi để trình duyệt dịch song song; thanh tiến trình chạy theo số chương trình đã xong
        [0.46, 'Chuẩn bị hình ảnh 3D…', function () {
          VU.G3.onWarm = function (done, total) { progress(0.46 + 0.44 * (total ? done / total : 1), 'Chuẩn bị hình ảnh 3D… ' + done + '/' + total); };
          return VU.G3.warm([[VU.G3.snapScene(), VU.G3.camera]]).then(function (n) { VU.G3.onWarm = null; return n; });
        }],
        [0.92, 'Chụp ảnh dụng cụ…', function () { VU.Tools3.finishIcons(jobs); jobs = null; }],
        [0.97, 'Mở cửa vườn ươm…', function () { VU.App.init(); }]
      ];
      var p = Promise.resolve();
      steps.forEach(function (s) {
        var t0;
        p = p.then(function () { progress(s[0], s[1]); return tick(); }).then(function () { t0 = performance.now(); return s[2](); })
          .then(function () { log.push([s[1].replace('…', ''), Math.round(performance.now() - t0)]); });
      });
      p.then(function () {
        VU.bootMs = Math.round(performance.now() - tBoot);
        progress(1, 'Sẵn sàng');
        var bt = $('boot'); if (bt) { bt.classList.add('done'); setTimeout(function () { bt.remove(); }, 700); }
        window.__vuReady = true;
      }).catch(function (e) { console.error(e); fail('Lỗi khởi động: ' + (e && e.message)); });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
